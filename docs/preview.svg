<text x="260" y="122" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#0f1115">我们先看一下这一季度的收入情况。</text>
<line x1="218" y1="143" x2="550" y2="143" stroke="rgba(15,18,23,0.10)" stroke-width="1"/>
