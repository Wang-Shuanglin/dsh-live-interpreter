<text x="260" y="156" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#0f1115">整体同比增长了百分之二十，其中云业务贡献了大部</text>
<text x="260" y="175" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#0f1115">分。</text>
