<text x="640" y="228" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#0f1115">Margins also improved by two percentage</text>
<text x="640" y="247" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#0f1115">points.</text>
<line x1="598" y1="268" x2="942" y2="268" stroke="rgba(15,18,23,0.10)" stroke-width="1"/>
<text x="598" y="281" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#61666b">00:26</text>
<text x="640" y="281" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="rgba(15,17,21,0.72)">That figure was driven mainly by the</text>
