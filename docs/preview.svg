<text x="640" y="175" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#0f1115">Overall revenue grew twenty percent year</text>
<text x="640" y="194" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#0f1115">over year, with</text>
<line x1="598" y1="215" x2="942" y2="215" stroke="rgba(15,18,23,0.10)" stroke-width="1"/>
<text x="598" y="228" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#61666b">00:19</text>
